name: Fetch water data

on:
  schedule:
    - cron: "*/10 * * * *"   # ทุก 10 นาที (GitHub อาจดีเลย์ 5–15 นาที) อย่าตั้งถี่กว่านี้: Pages จำกัดราว 10 builds/ชม.
  workflow_dispatch:          # กดรันเองได้ที่แท็บ Actions

permissions:
  contents: write

concurrency:
  group: fetch-water
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ThaiWater
        run: python3 scripts/fetch_water.py
        env:
          HOME_LAT: "13.8600"    # แก้เป็นพิกัดหมู่บ้านจริง
          HOME_LNG: "100.4800"
          RADIUS_KM: "30"        # เก็บข้อมูลรัศมีนี้ หน้าเว็บกรองให้แคบลงได้
          HISTORY_DAYS: "3"

      - name: Commit data
        run: |
          git config user.name "water-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
